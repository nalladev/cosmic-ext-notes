[package]
name = "markion-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Framework-independent Markion source-mapped Markdown editor core"
repository = "https://github.com/nalladev/cosmic-notes"

# Build independently of the host application and its GUI dependencies.
[workspace]

[dependencies]
pulldown-cmark = "0.13"
regex = "1.11"
ratex-parser = "=0.1.13"
tracing = "0.1"
serde_yaml = "0.9"
sha2 = "0.10"
unicode-segmentation = "1.12"

[dev-dependencies]
base64 = "0.22.1"
