
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: extractions/setup-just@v4
      - name: Install dependencies
        run: scripts/install-deps.sh
      - name: Run clippy
        run: just lint

  validate-flatpak:
    name: Validate Flatpak Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install flatpak-builder and appstreamcli
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak-builder python3 appstream

      - name: Validate manifest syntax
        run: |
          flatpak-builder --show-manifest io.github.nalladev.cosmic-ext-notes.json > /dev/null

      - name: Validate AppStream metadata
        run: |
          appstreamcli validate resources/app.metainfo.xml

      - name: Lint Flatpak manifest
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/mnt" \
            ghcr.io/flathub/flatpak-builder-lint:latest \
            manifest --gha-format /mnt/io.github.nalladev.cosmic-ext-notes.json
