[package]
name = "cosmic-notes"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "A notes application for the COSMIC desktop"
repository = "https://github.com/nalladev/cosmic-notes"

[dependencies]
i18n-embed = { version = "0.16", features = [
    "fluent-system",
    "desktop-requester",
] }
i18n-embed-fl = "0.10"
open = "5.3.2"
rust-embed = "8.8.0"
tokio = { version = "1.48.0", features = ["full"] }

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# See https://github.com/pop-os/libcosmic/blob/master/Cargo.toml for available features.
# Remove features if not needed.
features = [
    # About widget for the app
    "about",
    # On app startup, focuses an existing instance if the app is already open
    "single-instance",
    # Markdown widget
    "markdown",
    # QR code widget
    "qr_code",
    # GPU-accelerated rendering
    "wgpu",
    # xdg portal dialogs on Linux
    "xdg-portal"
]

# Uncomment to test a locally-cloned libcosmic
# [patch.'https://github.com/pop-os/libcosmic']
# libcosmic = { path = "../libcosmic" }
# cosmic-config = { path = "../libcosmic/cosmic-config" }
# cosmic-theme = { path = "../libcosmic/cosmic-theme" }

[package.metadata.deb]
license-file = "LICENSE"
assets = [
  ["target/release/cosmic-notes", "usr/bin/", "755"],
  ["resources/app.desktop", "usr/share/applications/com.github.nalladev.cosmic-notes.desktop", "644"],
  ["resources/app.metainfo.xml", "usr/share/appdata/com.github.nalladev.cosmic-notes.metainfo.xml", "644"],
  ["resources/icon.svg", "usr/share/icons/hicolor/scalable/apps/com.github.nalladev.cosmic-notes.svg", "644"],

]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/cosmic-notes", dest = "/usr/bin/cosmic-notes", mode = "755" },
  { source = "LICENSE", dest = "/usr/share/doc/cosmic-notes/LICENSE", doc = true, mode = "644" },
  { source = "resources/app.desktop", dest = "/usr/share/applications/com.github.nalladev.cosmic-notes.desktop", mode = "644" },
  { source = "resources/app.metainfo.xml", dest = "/usr/share/appdata/com.github.nalladev.cosmic-notes.metainfo.xml", mode = "644" },
  { source = "resources/icon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/com.github.nalladev.cosmic-notes.svg", mode = "644" },

]
